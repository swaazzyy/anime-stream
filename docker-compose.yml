services:
  gluetun:
    image: qmcgaw/gluetun:v3
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      # Puerto de la plataforma web GoAnime (comparte la red de Gluetun).
      # La API de control (8000) NO se publica: GoAnime la alcanza por localhost dentro del mismo namespace.
      - "8080:8080"
    environment:
      - VPN_SERVICE_PROVIDER=${VPN_SERVICE_PROVIDER:-custom}
      - VPN_TYPE=${VPN_TYPE:-wireguard}
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY:-}
      - WIREGUARD_ADDRESSES=${WIREGUARD_ADDRESSES:-}
      - OPENVPN_USER=${OPENVPN_USER:-}
      - OPENVPN_PASSWORD=${OPENVPN_PASSWORD:-}
      - SERVER_COUNTRIES=${SERVER_COUNTRIES:-Switzerland}
      # Gluetun >= v3.39.1 exige autenticación en su API de control
      - HTTP_CONTROL_SERVER_AUTH_DEFAULT_ROLE={"auth":"apikey","apikey":"${GLUETUN_API_KEY:?define GLUETUN_API_KEY en .env}"}
      # Configuración de DNS seguro
      - DOT=on
      - BLOCK_MALICIOUS=on
    restart: unless-stopped

  anime-stream:
    build: .
    container_name: anime-stream
    # 🔒 Al usar network_mode: "service:gluetun", todo el tráfico BitTorrent y HTTP
    # pasa forzosamente por la VPN con Kill Switch automático en caso de caída.
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    volumes:
      - ./downloads:/app/downloads
      - ./data:/app/data
    environment:
      # PORT, DB_PATH, DOWNLOADS_DIR y GLUETUN_CONTROL_URL ya vienen del Dockerfile
      - GLUETUN_API_KEY=${GLUETUN_API_KEY}
      - VPN_SERVICE_PROVIDER=${VPN_SERVICE_PROVIDER:-custom}
      - VPN_TYPE=${VPN_TYPE:-wireguard}
    restart: unless-stopped
